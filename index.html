<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صندوق محل الدراجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: header with live caisse figure, sticky tab bar, one working column per view (RTL) */
:root{
  --bg:#edf0f2; --surface:#ffffff; --sunk:#f5f7f8; --ink:#17232b; --muted:#5b6a74; --line:#d6dde2;
  --accent:#c35d17; --accent-soft:#f6e3d4; --on-accent:#ffffff;
  --cash:#2c7a57; --bank:#2d5d9c; --exp:#b0383a; --wd:#74489f;
  --cash-soft:#dcefe5; --bank-soft:#dce6f4; --exp-soft:#f5dddd; --wd-soft:#e9e0f3;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#131c22; --ink:#e5ecf0; --muted:#94a4ae; --line:#28363f;
  --accent:#e8843c; --accent-soft:#3a2617; --on-accent:#1a0e05;
  --cash:#55b98c; --bank:#72a1e3; --exp:#e57373; --wd:#ad8ad8;
  --cash-soft:#183327; --bank-soft:#182a40; --exp-soft:#3a1b1c; --wd-soft:#2a1f38;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#131c22; --ink:#e5ecf0; --muted:#94a4ae; --line:#28363f;
  --accent:#e8843c; --accent-soft:#3a2617; --on-accent:#1a0e05;
  --cash:#55b98c; --bank:#72a1e3; --exp:#e57373; --wd:#ad8ad8;
  --cash-soft:#183327; --bank-soft:#182a40; --exp-soft:#3a1b1c; --wd-soft:#2a1f38;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:1.45rem}
h2{font-size:1.15rem}
h3{font-size:1rem;font-family:var(--f-body);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.brand p{margin:0;font-size:.82rem;color:var(--muted)}
.hstats{display:flex;gap:22px;flex-wrap:wrap}
.hstat .k{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.hstat .v{font-size:1.35rem;font-weight:600}
.hstat.main .v{color:var(--accent)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:11px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main .wrap{padding-block:20px 60px;display:grid;gap:22px}
section.block{display:grid;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.act{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start}
.act:hover{border-color:var(--muted)}
.act .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.act b{display:block;font-weight:600}
.act span.small{color:var(--muted)}
.t-sale .dot{background:var(--cash-soft);color:var(--cash)}
.t-advance .dot{background:var(--bank-soft);color:var(--bank)}
.t-expense .dot{background:var(--exp-soft);color:var(--exp)}
.t-withdrawal .dot{background:var(--wd-soft);color:var(--wd)}
.t-deposit .dot{background:var(--accent-soft);color:var(--accent)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.25rem;font-weight:600}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi.pos .v{color:var(--cash)} .kpi.neg .v{color:var(--exp)} .kpi.wd .v{color:var(--wd)} .kpi.acc .v{color:var(--accent)}

/* capital */
.capital{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:center}
.capital .big{font-size:2.1rem;font-weight:600;color:var(--accent);line-height:1.2}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin-block:10px}
.stack i{display:block;height:100%}
.legend{display:grid;gap:6px}
.legend div{display:flex;justify-content:space-between;gap:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}

/* day equation */
.eq{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.eq .term{background:var(--sunk);border-radius:8px;padding:8px 12px;display:grid;min-width:0}
.eq .term .k{font-size:.75rem;color:var(--muted)}
.eq .op{align-self:center;font-family:var(--f-num);color:var(--muted);font-size:1.1rem}
.eq .term.res{background:var(--accent-soft)}
.eq .term.res .num{color:var(--accent);font-weight:600}

/* date nav */
.datenav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=month],input[type=number],input[type=text],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
input[type=number]{font-family:var(--f-num)}

/* tables & lists */
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-weight:500;color:var(--muted);font-size:.8rem;text-align:start;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:end}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:500;white-space:nowrap}
.p-sale{background:var(--cash-soft);color:var(--cash)}
.p-advance{background:var(--bank-soft);color:var(--bank)}
.p-expense{background:var(--exp-soft);color:var(--exp)}
.p-withdrawal{background:var(--wd-soft);color:var(--wd)}
.p-deposit{background:var(--accent-soft);color:var(--accent)}
.m-cash{color:var(--cash)} .m-transfer{color:var(--bank)} .m-cheque{color:var(--bank)}
.amt-in{color:var(--cash)} .amt-out{color:var(--exp)} .amt-wd{color:var(--wd)}
.ex{font-size:.7rem;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-inline-start:6px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hbars{display:grid;gap:10px}
.hbar .top{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.hbar .track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:4px}
.hbar .track i{display:block;height:100%;border-radius:4px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.chart{width:100%;height:auto;display:block}
.chartbox{direction:ltr}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}

.notice{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--sunk);border-radius:var(--r)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,16,20,.45)}
dialog form{display:grid;gap:14px;padding:18px}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.calc{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:.9rem}
.calc div{display:flex;justify-content:space-between;gap:8px}
.err{color:var(--exp);font-size:.85rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:20;font-size:.9rem}

@media (max-width:720px){
  .capital,.grid2{grid-template-columns:minmax(0,1fr)}
  .hstat .v{font-size:1.1rem}
  .capital .big{font-size:1.7rem}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.act,.btn,.chip{transition:border-color .15s,background .15s}}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.login{max-width:380px;margin:8vh auto;display:grid;gap:14px}
.login form{display:grid;gap:12px}
</style>
</head>
<body>

<div dir="rtl" lang="ar">
<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M6.5 27 A15 15 0 0 1 33.5 27" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="22" x2="29" y2="12" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="22" r="3" fill="var(--ink)"/></svg>
    <div><h1>صندوق المحل</h1><p>تتبع المبيعات والمصاريف والسحوبات</p></div>
  </div>
  <div class="hstats">
    <div class="hstat main"><div class="k">في الصندوق الآن (cash)</div><div class="v" id="hCash">—</div></div>
    <div class="hstat"><div class="k">الكابيتال الكامل</div><div class="v" id="hCap">—</div></div>
    <button class="btn sm ghost" id="logout" hidden>خروج</button>
  </div>
</div></header>
<nav class="tabs" aria-label="الأقسام"><div class="wrap">
  <a href="#day" data-v="day">اليوم</a>
  <a href="#caisse" data-v="caisse">الصندوق والسحوبات</a>
  <a href="#analytics" data-v="analytics">التحليلات</a>
  <a href="#journal" data-v="journal">السجل</a>
</div></nav>
<main><div class="wrap" id="view"><div class="empty">جارٍ تحميل البيانات…</div></div></main>

<dialog id="dlg"><form id="frm" novalidate></form></dialog>
<div class="toast" id="toast" hidden></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
const TYPES = {
  sale:{l:'بيع دراجة', s:'بيع', ic:'+'},
  advance:{l:'تسبيق (avance)', s:'تسبيق', ic:'+'},
  expense:{l:'مصروف', s:'مصروف', ic:'−'},
  withdrawal:{l:'سحب من الصندوق', s:'سحب', ic:'↑'},
  deposit:{l:'إيداع في الصندوق', s:'إيداع', ic:'↓'}
};
const METHODS = {cash:'نقداً (cash)', transfer:'تحويل (virement)', cheque:'شيك (chèque)'};
const EXP_CATS = ['توصيل','نظافة','كراء','كهرباء وماء','أجور','صيانة','شراء سلع','أخرى'];
const MODELS = ['Sania','Daytona','Xadv 125cc','Spring'];
const MONTHS = ['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];

const S = { db:null, col:null, entries:[], loaded:false, offline:false, readonly:false,
  day:null, dayChosen:false, period:'month', pMonth:null, pYear:null,
  jType:'all', jMonth:'all', jQ:'', editing:null, ftype:'sale', fmode:'amount', fmethod:'cash', fcat:'توصيل' };

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const parse = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (iso,n) => { const d = parse(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const fmtDate = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const monthOf = iso => iso.slice(0,7);
const monthLabel = ym => { const [y,m] = ym.split('-'); return `${MONTHS[+m-1]} ${y}`; };
const weekStart = iso => { const d = parse(iso); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return isoOf(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => { const r = Math.round(n*100)/100; const neg = r<0; const [i,dd] = Math.abs(r).toFixed(2).split('.'); const s = i.replace(/\B(?=(\d{3})+(?!\d))/g,' ') + (dd!=='00' ? ','+dd : ''); return (neg?'−':'') + s; };
const money = (n, cls='') => `<span class="num ${cls}" dir="ltr">${fmtN(n)} DH</span>`;
const kfmt = n => { const a = Math.abs(n); if (a>=1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace('.0','')+'M'; if (a>=1e3) return (n/1e3).toFixed(a>=1e4?0:1).replace('.0','')+'k'; return String(Math.round(n)); };
const $ = s => document.querySelector(s);

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2600); }

/* ---------- money logic ---------- */
const isIncome = e => e.type==='sale' || e.type==='advance';
function cashDelta(e){
  const a = +e.amount || 0;
  if ((isIncome(e) || e.type==='deposit') && e.method==='cash') return a;
  if (e.type==='expense' && e.method==='cash') return -a;
  if (e.type==='withdrawal') return -a;
  return 0;
}
function bankDelta(e){
  const a = +e.amount || 0;
  if (isIncome(e) && e.method!=='cash') return a;
  if (e.type==='expense' && e.method!=='cash') return -a;
  return 0;
}
function agg(list){
  const r = {sales:0,salesCash:0,salesBank:0,nSales:0, adv:0,advCash:0,advBank:0,nAdv:0, exp:0,expCash:0,nExp:0, wd:0,nWd:0, dep:0, income:0,incCash:0,incBank:0, net:0, cash:0};
  for (const e of list){
    const a = +e.amount||0, c = e.method==='cash';
    if (e.type==='sale'){ r.sales+=a; r.nSales++; c? r.salesCash+=a : r.salesBank+=a; }
    else if (e.type==='advance'){ r.adv+=a; r.nAdv++; c? r.advCash+=a : r.advBank+=a; }
    else if (e.type==='expense'){ r.exp+=a; r.nExp++; if (c) r.expCash+=a; }
    else if (e.type==='withdrawal'){ r.wd+=a; r.nWd++; }
    else if (e.type==='deposit'){ r.dep+=a; }
    r.cash += cashDelta(e);
  }
  r.income = r.sales + r.adv; r.incCash = r.salesCash + r.advCash; r.incBank = r.salesBank + r.advBank;
  r.net = r.income - r.exp;
  return r;
}
const sorted = () => S.entries.slice().sort((a,b)=> a.date===b.date ? String(a.createdAt).localeCompare(String(b.createdAt)) : a.date.localeCompare(b.date));
const cashUpTo = iso => S.entries.reduce((s,e)=> e.date<=iso ? s+cashDelta(e) : s, 0);
const inRange = (from,to) => S.entries.filter(e => e.date>=from && e.date<=to);
function totals(){
  const cash = S.entries.reduce((s,e)=>s+cashDelta(e),0);
  const bank = S.entries.reduce((s,e)=>s+bankDelta(e),0);
  const wd = S.entries.reduce((s,e)=> e.type==='withdrawal' ? s+(+e.amount||0) : s, 0);
  const dep = S.entries.reduce((s,e)=> e.type==='deposit' ? s+(+e.amount||0) : s, 0);
  return {cash, bank, wd, dep, capital: cash+bank+wd};
}
function lastDate(){ return S.entries.reduce((m,e)=> e.date>m ? e.date : m, today()); }
function firstDate(){ return S.entries.reduce((m,e)=> e.date<m ? e.date : m, today()); }

/* ---------- charts ---------- */
function niceTicks(max){
  if (max<=0) max = 1;
  const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/p;
  const step = (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const top = Math.ceil(max/step)*step; const t = [];
  for (let v=0; v<=top+1e-9; v+=step) t.push(v);
  return {top, t};
}
function barChart(buckets, series){
  const W=680,H=240,pl=48,pr=10,pt=12,pb=30, cw=W-pl-pr, ch=H-pt-pb;
  const max = Math.max(0, ...buckets.flatMap(b=>b.vals));
  const {top,t} = niceTicks(max); const y = v => pt + ch - (v/top)*ch;
  const n = buckets.length || 1, gw = cw/n, bw = Math.max(1.5, Math.min(26, gw*0.78/series.length));
  const every = Math.ceil(n/10);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (const v of t) s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`;
  buckets.forEach((b,i)=>{
    const gx = pl + i*gw + (gw - bw*series.length)/2;
    b.vals.forEach((v,j)=>{ if (v<=0) return; const h = ch*(v/top);
      s += `<rect x="${gx+j*bw}" y="${pt+ch-h}" width="${bw-1}" height="${h}" rx="2" fill="${series[j].color}"><title>${esc(b.title||b.label)} · ${esc(series[j].name)}: ${fmtN(v)} DH</title></rect>`; });
    if (i%every===0) s += `<text x="${pl+i*gw+gw/2}" y="${H-10}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  s += `<line class="axis" x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}"/></svg>`;
  return s;
}
function lineChart(points){ // [{label, v, title}]
  const W=680,H=200,pl=48,pr=14,pt=14,pb=30, cw=W-pl-pr, ch=H-pt-pb;
  const vals = points.map(p=>p.v); const mn = Math.min(0,...vals), mx = Math.max(0,...vals);
  const {top,t} = niceTicks(mx - mn || 1); const lo = mn<0 ? -niceTicks(-mn).top : 0; const hi = lo + top;
  const y = v => pt + ch - ((v-lo)/(hi-lo))*ch;
  const n = points.length; const x = i => pl + (n<=1 ? cw/2 : i*cw/(n-1));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (const v0 of t){ const v = lo+v0; s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`; }
  if (n){
    const d = points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    s += `<path d="${d}L${x(n-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z" fill="var(--accent)" fill-opacity=".12"/>`;
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    const every = Math.ceil(n/8);
    points.forEach((p,i)=>{ if (i%every===0 || i===n-1) s += `<text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`;
      s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===n-1?4:6}" fill="${i===n-1?'var(--accent)':'transparent'}"><title>${esc(p.title)}: ${fmtN(p.v)} DH</title></circle>`; });
  }
  return s + `</svg>`;
}

/* ---------- shared rendering ---------- */
function entryLabel(e){
  if (e.type==='expense') return esc(e.category||'مصروف') + (e.label ? ` — ${esc(e.label)}` : '');
  if (e.type==='withdrawal') return 'سحب من الصندوق' + (e.kept!=null ? ` <span class="muted small">(بقي ${fmtN(e.kept)} DH)</span>` : '');
  if (e.type==='deposit') return esc(e.label || 'إيداع في الصندوق');
  return esc(e.label || '—') + (e.client ? ` <span class="muted small">· ${esc(e.client)}</span>` : '');
}
function amountCell(e){
  const cls = isIncome(e)||e.type==='deposit' ? 'amt-in' : e.type==='withdrawal' ? 'amt-wd' : 'amt-out';
  const sign = isIncome(e)||e.type==='deposit' ? '+' : '−';

}

function periodRange(){
  const td = today();
  if (S.period==='week'){ const w = weekStart(td); return {from:w,to:addDays(w,6),label:'هذا الأسبوع'}; }
  if (S.period==='month'){ const m = S.pMonth || monthOf(td); return {from:m+'-01',to:m+'-31',label:monthLabel(m)}; }
  if (S.period==='year'){ const y = S.pYear || td.slice(0,4); return {from:y+'-01-01',to:y+'-12-31',label:'سنة '+y}; }
  return {from:firstDate(), to:lastDate(), label:'منذ البداية'};
}
function viewAnalytics(){

  const capParts = [{k:'في الصندوق (cash)',v:Math.max(0,T.cash),c:'var(--accent)'},{k:'عبر البنك (virement / chèque)',v:Math.max(0,T.bank),c:'var(--bank)'},{k:'سحبتها من الصندوق',v:T.wd,c:'var(--wd)'}];
  const capSum = capParts.reduce((s,p)=>s+p.v,0)||1;
  // buckets
  let to = R.to; if (S.period!=='all' && to>lastDate() && R.from<=td) to = td < R.to ? td : R.to;
  if (S.period==='month'){ const end = parse(R.from); end.setMonth(end.getMonth()+1,0); to = isoOf(end); }
  if (S.period==='week') to = R.to;
  const span = (parse(to)-parse(R.from))/864e5 + 1;
  const monthly = span > 62;
  const buckets = []; const series = [];
  if (monthly){
    const ms = {}; for (const e of list){ const m = monthOf(e.date); (ms[m] ||= []).push(e); }
    let m = monthOf(R.from); const mEnd = monthOf(to);

  const pts2 = pts.length>120 ? pts.filter((p,i)=> i%Math.ceil(pts.length/120)===0 || i===pts.length-1) : pts;

  <section class="panel">
    <h3 style="margin-bottom:6px">الملخص الشهري</h3>
    ${mRows.length?`<div class="tablebox"><table><thead><tr><th>الشهر</th><th class="n">المبيعات</th><th class="n">التسبيقات</th><th class="n">المداخيل</th><th class="n">نقداً</th><th class="n">virement/chèque</th><th class="n">المصاريف</th><th class="n">الصافي</th><th class="n">المسحوب</th><th class="n">الصندوق آخر الشهر</th></tr></thead><tbody>${
      mRows.map(r=>`<tr><td style="white-space:nowrap">${monthLabel(r.m)}</td><td class="n">${money(r.g.sales)}</td><td class="n">${money(r.g.adv)}</td><td class="n">${money(r.g.income,'amt-in')}</td><td class="n">${money(r.g.incCash)}</td><td class="n">${money(r.g.incBank)}</td><td class="n">${money(r.g.exp,'amt-out')}</td><td class="n">${money(r.g.net)}</td><td class="n">${money(r.g.wd,'amt-wd')}</td><td class="n">${money(r.end)}</td></tr>`).join('')
    }</tbody></table></div>`:'<div class="empty">لا توجد بيانات بعد.</div>'}
  </section>`;
}
function yearsList(){ const ys = new Set([today().slice(0,4)]); for (const e of S.entries) ys.add(e.date.slice(0,4)); return [...ys].sort().reverse(); }
function monthsList(){ const ms = new Set(); for (const e of S.entries) ms.add(monthOf(e.date)); return [...ms].sort().reverse(); }

function journalList(){
  const q = S.jQ.trim().toLowerCase();
  return sorted().reverse().filter(e => (S.jType==='all'||e.type===S.jType) && (S.jMonth==='all'||monthOf(e.date)===S.jMonth)
    && (!q || [e.label,e.client,e.note,e.category].join(' ').toLowerCase().includes(q)));
}
function viewJournal(){
  const list = journalList(); const a = agg(list);
  return `${statusNotice()}
  <section class="block">
    <div class="row between"><h2>كل العمليات</h2><button class="btn" id="csv">تصدير CSV (Excel)</button></div>
    <div class="row">
      <select id="jType"><option value="all">كل الأنواع</option>${Object.keys(TYPES).map(t=>`<option value="${t}" ${S.jType===t?'selected':''}>${TYPES[t].l}</option>`).join('')}</select>
      <select id="jMonth"><option value="all">كل الأشهر</option>${monthsList().map(m=>`<option value="${m}" ${S.jMonth===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>
      <input type="text" id="jQ" placeholder="بحث: موديل، زبون، ملاحظة…" value="${esc(S.jQ)}" style="flex:1;min-width:180px">
    </div>
    <div class="muted small">${list.length} عملية · مداخيل ${fmtN(a.income)} DH · مصاريف ${fmtN(a.exp)} DH · سحوبات ${fmtN(a.wd)} DH</div>
    <div class="panel">${rowsTable(list,true)}</div>
  </section>`;
}

function render(){
  if (S.db && !started) return;
  const v = currentView();
  document.querySelectorAll('nav.tabs a').forEach(a => a.dataset.v===v ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  const T = totals();
  $('#hCash').innerHTML = S.loaded ? money(T.cash) : '—';
  $('#hCap').innerHTML = S.loaded ? money(T.capital) : '—';
  if (!S.loaded){ $('#view').innerHTML = `${S.db===null && initDone ? statusNotice() : ''}<div class="empty">${S.offline?'تعذّر الوصول إلى البيانات حالياً.':'جارٍ تحميل البيانات…'}</div>`; return; }
  const focusId = document.activeElement && document.activeElement.id;
  $('#view').innerHTML = v==='caisse' ? viewCaisse() : v==='analytics' ? viewAnalytics() : v==='journal' ? viewJournal() : viewDay();
  if (focusId==='jQ'){ const el = $('#jQ'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}
function currentView(){ const h = location.hash.slice(1); return ['day','caisse','analytics','journal'].includes(h) ? h : 'day'; }

/* ---------- form ---------- */
const dlg = $('#dlg'), frm = $('#frm');
function openForm(type, entry){
  S.editing = entry || null; S.ftype = entry ? entry.type : type;
  S.fmethod = entry?.method || 'cash'; S.fcat = entry?.category || 'توصيل'; S.fmode = 'amount';
  drawForm(entry); dlg.showModal();
  setTimeout(()=>{ const f = frm.querySelector('[data-first]'); f && f.focus(); }, 30);
}
function drawForm(e){
  const t = S.ftype, date = e?.date || S.day || today();
  const seg = (name, opts, cur) => `<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-val="${esc(v)}" aria-pressed="${v===cur}">${esc(l)}</button>`).join('')}</div>`;
  const models = [...new Set([...MODELS, ...S.entries.filter(x=>x.type==='sale'||x.type==='advance').map(x=>x.label).filter(Boolean)])];
  let body = '';
  if (t==='sale' || t==='advance'){
    body = `<div class="field"><label for="fLabel">${t==='sale'?'الدراجة المباعة (الموديل)':'الدراجة المعنية بالتسبيق'}</label><input type="text" id="fLabel" list="mdl" data-first value="${esc(e?.label||'')}" placeholder="مثلاً: Daytona"><datalist id="mdl">${models.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div>
    <div class="field"><label for="fAmount">المبلغ (DH)</label><input type="number" id="fAmount" inputmode="decimal" min="0" step="any" value="${e?.amount??''}"></div>
    <div class="field"><span class="lbl">طريقة الأداء</span>${seg('method',Object.entries(METHODS),S.fmethod)}</div>
    <div class="field"><label for="fClient">اسم الزبون (اختياري)</label><input type="text" id="fClient" value="${esc(e?.client||'')}"></div>`;
  } else if (t==='expense'){
    body = `<div class="field"><span class="lbl">نوع المصروف</span>${seg('cat',EXP_CATS.map(c=>[c,c]),S.fcat)}</div>
    <div class="field"><label for="fLabel">التفاصيل (اختياري)</label><input type="text" id="fLabel" value="${esc(e?.label||'')}" placeholder="مثلاً: توصيل دراجة إلى الزبون"></div>
    <div class="field"><label for="fAmount">المبلغ (DH)</label><input type="number" id="fAmount" data-first inputmode="decimal" min="0" step="any" value="${e?.amount??''}"></div>
    <div class="field"><span class="lbl">دُفع من</span>${seg('method',[['cash','الصندوق (cash)'],['transfer','البنك (virement)'],['cheque','شيك']],S.fmethod)}</div>`;
  } else if (t==='withdrawal'){
    body = `<div class="field"><span class="lbl">طريقة السحب</span>${seg('mode',[['amount','أسحب مبلغاً محدداً'],['keep','أترك مبلغاً في الصندوق']],S.fmode)}</div>
    <div class="field"><label for="fAmount" id="fAmountLbl">${S.fmode==='keep'?'المبلغ الذي سيبقى في الصندوق (DH)':'المبلغ المسحوب (DH)'}</label><input type="number" id="fAmount" data-first inputmode="decimal" min="0" step="any" value="${e ? (S.fmode==='keep' ? (e.kept??'') : e.amount) : ''}"></div>
    <div class="calc" id="wdCalc"></div>`;
  } else {
    body = `<div class="field"><label for="fAmount">المبلغ المودع في الصندوق (DH)</label><input type="number" id="fAmount" data-first inputmode="decimal" min="0" step="any" value="${e?.amount??''}"></div>
    <div class="field"><label for="fLabel">السبب</label><input type="text" id="fLabel" value="${esc(e?.label||'رصيد افتتاحي')}"></div>`;
  }
  frm.innerHTML = `<div class="row between"><h2>${e?'تعديل: ':''}${TYPES[t].l}</h2><button type="button" class="btn sm ghost" id="fClose">إغلاق</button></div>
    <div class="field"><label for="fDate">التاريخ</label><input type="date" id="fDate" value="${date}"></div>
    ${body}
    <div class="field"><label for="fNote">ملاحظة (اختياري)</label><input type="text" id="fNote" value="${esc(e?.note||'')}"></div>
    <div class="err" id="fErr" hidden></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="fCancel">إلغاء</button><button type="submit" class="btn primary" id="fSave">${e?'حفظ التعديل':'حفظ'}</button></div>`;
  if (t==='withdrawal') updateWdCalc();
}
function wdBalance(){
  const d = $('#fDate')?.value || today();
  let bal = cashUpTo(d);
  if (S.editing && S.editing.date<=d) bal += +S.editing.amount; // ignore the row being edited
  return bal;
}
function wdCompute(){
  const bal = wdBalance(); const v = parseFloat($('#fAmount').value);
  if (isNaN(v)) return {bal, amount:null, kept:null};
  return S.fmode==='keep' ? {bal, amount: bal - v, kept: v} : {bal, amount: v, kept: bal - v};
}
function updateWdCalc(){
  const c = wdCompute(), box = $('#wdCalc'); if (!box) return;
  box.innerHTML = `<div><span>في الصندوق بتاريخ ${fmtDate($('#fDate').value||today())}</span>${money(c.bal)}</div>
    <div><span>المبلغ المسحوب</span>${c.amount==null?'—':money(c.amount,'amt-wd')}</div>
    <div><span>يبقى في الصندوق</span>${c.kept==null?'—':money(c.kept)}</div>
    <div class="small muted" style="justify-content:flex-start"><button type="button" class="btn sm" id="wdAll">سحب كل شيء (الصندوق = 0)</button></div>`;
}
frm.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id==='fClose' || b.id==='fCancel'){ dlg.close(); return; }
  if (b.id==='wdAll'){ S.fmode='keep'; const keepV = 0; const d = $('#fDate').value, note = $('#fNote').value; drawForm(S.editing); $('#fDate').value = d; $('#fNote').value = note; $('#fAmount').value = keepV; updateWdCalc(); return; }
  const seg = b.closest('[data-seg]'); if (!seg) return;
  const name = seg.dataset.seg, val = b.dataset.val;
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b));
  if (name==='method') S.fmethod = val;
  if (name==='cat') S.fcat = val;
  if (name==='mode'){ S.fmode = val; $('#fAmountLbl').textContent = val==='keep' ? 'المبلغ الذي سيبقى في الصندوق (DH)' : 'المبلغ المسحوب (DH)'; $('#fAmount').value=''; updateWdCalc(); }
});
frm.addEventListener('input', ev => { if (S.ftype==='withdrawal' && (ev.target.id==='fAmount'||ev.target.id==='fDate')) updateWdCalc(); });
frm.addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('#fErr'); err.hidden = true;
  const t = S.ftype, date = $('#fDate').value;
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!date) return fail('اختر التاريخ.');
  let amount = parseFloat($('#fAmount').value);
  const rec = { type:t, date, note: $('#fNote').value.trim() };
  if (t==='withdrawal'){
    const c = wdCompute();
    if (c.amount==null) return fail('أدخل المبلغ.');
    if (c.amount<=0) return fail(S.fmode==='keep' ? 'المبلغ المتبقي يجب أن يكون أقل من الموجود في الصندوق.' : 'المبلغ يجب أن يكون أكبر من صفر.');
    if (c.kept < 0) return fail(`لا يمكن سحب أكثر من الموجود في الصندوق (${fmtN(c.bal)} DH).`);
    rec.amount = Math.round(c.amount*100)/100; rec.kept = Math.round(c.kept*100)/100; rec.method = 'cash';
  } else {
    if (isNaN(amount) || amount<=0) return fail('أدخل مبلغاً أكبر من صفر.');
    rec.amount = Math.round(amount*100)/100;
    rec.method = t==='deposit' ? 'cash' : S.fmethod;
    rec.label = ($('#fLabel')?.value || '').trim();
    if (t==='sale'||t==='advance'){ if (!rec.label) return fail('اكتب اسم الدراجة.'); rec.client = $('#fClient').value.trim(); }
    if (t==='expense') rec.category = S.fcat;
  }
  const btn = $('#fSave'); btn.disabled = true;
  try {
    if (S.editing){ rec.createdAt = S.editing.createdAt || new Date().toISOString(); await dbSave(rec, S.editing.id); toast('تم حفظ التعديل'); }
    else { rec.createdAt = new Date().toISOString(); await dbSave(rec); toast('تم الحفظ'); }
    S.day = date; S.dayChosen = true; dlg.close(); render();
  } catch(e){
    btn.disabled = false;
    fail('تعذّر الحفظ: ' + (e && e.message ? e.message : 'تحقق من الاتصال وحاول مرة أخرى.'));
  }
});

/* ---------- page events ---------- */
let delArm = null;
document.addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b || b.closest('#frm')) return;
  if (b.dataset.add){ openForm(b.dataset.add); return; }
  if (b.dataset.dnav!=null){ const n = +b.dataset.dnav; S.day = n===0 ? today() : addDays(S.day, n); S.dayChosen = true; render(); return; }
  if (b.dataset.period){ S.period = b.dataset.period; render(); return; }
  if (b.dataset.edit){ const e = S.entries.find(x=>x.id===b.dataset.edit); if (e) openForm(e.type, e); return; }
  if (b.dataset.del){
    if (delArm!==b.dataset.del){ delArm = b.dataset.del; b.textContent = 'تأكيد الحذف'; b.classList.add('primary'); setTimeout(()=>{ if (delArm===b.dataset.del){ delArm=null; b.textContent='حذف'; b.classList.remove('primary'); } }, 3500); return; }
    delArm = null; b.disabled = true;
    try { await dbDel(b.dataset.del); toast('تم الحذف'); } catch(e){ toast('تعذّر الحذف'); b.disabled = false; }
    return;
  }
  if (b.id==='clearEx'){
    if (b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='تأكيد حذف الأمثلة'; return; }
    b.disabled = true;
    for (const e of S.entries.filter(x=>x.example)){ try { await dbDel(e.id); } catch(_){} }
    S.day = today(); toast('تم حذف الأمثلة'); return;
  }
  if (b.id==='csv') exportCsv();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id==='dayPick' && t.value){ S.day = t.value; S.dayChosen = true; render(); }
  if (t.id==='pMonth' && t.value){ S.pMonth = t.value; render(); }
  if (t.id==='pYear'){ S.pYear = t.value; render(); }
  if (t.id==='jType'){ S.jType = t.value; render(); }
  if (t.id==='jMonth'){ S.jMonth = t.value; render(); }
});
let qT; document.addEventListener('input', ev => { if (ev.target.id==='jQ'){ S.jQ = ev.target.value; clearTimeout(qT); qT = setTimeout(render, 250); } });
window.addEventListener('hashchange', render);

async function exportCsv(){
  const list = journalList();
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const lines = [['التاريخ','النوع','البيان','نوع المصروف','الزبون','طريقة الأداء','المبلغ','بقي في الصندوق','ملاحظة'].map(q).join(',')];
  for (const e of list) lines.push([fmtDate(e.date), TYPES[e.type].l, e.label||'', e.category||'', e.client||'', e.type==='withdrawal'||e.type==='deposit'?'cash':(e.method||''), e.amount, e.kept??'', e.note||''].map(q).join(','));
  const data = '﻿' + lines.join('\r\n');
  const url = URL.createObjectURL(new Blob([data], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = `caisse-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ---------- Supabase ---------- */
const FIELDS = ['type','date','amount','method','label','category','client','note','kept','example'];
const fromRow = r => ({ id:r.id, type:r.type, date:r.date, amount:+r.amount, method:r.method||'cash', label:r.label||'', category:r.category||'',
  client:r.client||'', note:r.note||'', kept: r.kept==null ? null : +r.kept, example:!!r.example, createdAt:r.created_at });
function toRow(rec){ const o = {}; for (const k of FIELDS) if (rec[k]!==undefined) o[k] = rec[k]===''&&k!=='note'&&k!=='label' ? null : rec[k]; return o; }
async function dbSave(rec, id){
  const row = toRow(rec);
  const q = id ? S.db.from('entries').update(row).eq('id', id) : S.db.from('entries').insert(row);
  const { error } = await q; if (error) throw error;
  await loadAll();
}
async function dbDel(id){ const { error } = await S.db.from('entries').delete().eq('id', id); if (error) throw error; await loadAll(); }
async function loadAll(){
  const all = []; const page = 1000;
  for (let from = 0; ; from += page){
    const { data, error } = await S.db.from('entries').select('*').order('date').order('created_at').range(from, from+page-1);
    if (error) throw error;
    all.push(...data); if (data.length < page) break;
  }
  S.entries = all.map(fromRow).filter(e => e.date && TYPES[e.type]);
  if (!S.loaded && !S.dayChosen && !S.entries.some(e=>e.date===today())){ const ex = S.entries.find(e=>e.example); if (ex) S.day = ex.date; }
  S.loaded = true; S.offline = false; render();
}
let reloadT;
function startSync(){
  loadAll().catch(()=>{ S.offline = true; S.loaded = true; render(); });
  S.db.channel('entries-live').on('postgres_changes', {event:'*', schema:'public', table:'entries'},
    () => { clearTimeout(reloadT); reloadT = setTimeout(()=>loadAll().catch(()=>{}), 400); }).subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll().catch(()=>{}); });
}
function showLogin(msg){
  $('#hCash').innerHTML = '—'; $('#hCap').innerHTML = '—'; $('#logout').hidden = true;
  $('#view').innerHTML = `<div class="login panel"><h2>تسجيل الدخول</h2><p class="muted small" style="margin:0">ادخل بالبريد وكلمة السر التي أنشأتها في Supabase.</p>
    <form id="loginForm"><div class="field"><label for="lEmail">البريد الإلكتروني</label><input type="email" id="lEmail" autocomplete="username" required dir="ltr"></div>
    <div class="field"><label for="lPass">كلمة السر</label><input type="password" id="lPass" autocomplete="current-password" required dir="ltr"></div>
    <div class="err" id="lErr" ${msg?'':'hidden'}>${esc(msg||'')}</div>
    <button class="btn primary" type="submit">دخول</button></form></div>`;
  $('#loginForm').addEventListener('submit', async ev => {
    ev.preventDefault(); const err = $('#lErr'); err.hidden = true;
    const { error } = await S.db.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lPass').value });
    if (error){ err.textContent = 'البريد أو كلمة السر غير صحيحة.'; err.hidden = false; }
  });
}

/* ---------- boot ---------- */
let initDone = true, started = false;
S.day = today();
const cfg = window.CAISSE_CONFIG || {};
if (!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_URL.includes('XXXX')){
  S.db = null; S.loaded = true; render();
} else {
  S.db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  window.addEventListener('hashchange', () => { if (!started) showLogin(); });
  $('#logout').addEventListener('click', async () => { await S.db.auth.signOut(); location.reload(); });
  S.db.auth.onAuthStateChange((event, session) => {
    if (session && !started){ started = true; $('#logout').hidden = false; render(); startSync(); }
    else if (!session && !started) showLogin();
  });
}
})();
</script>
</body>
